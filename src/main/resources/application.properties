spring.application.name=evangeloswebsite

# Hosts like Railway tell the app which port to use via $PORT; locally it's 8080.
server.port=${PORT:8080}
# Behind the host's HTTPS proxy, trust its X-Forwarded-* headers so redirects stay on https://.
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:h2:file:./data/personalsite
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Room for a full semester's Canvas calendar export and long voice recordings on the Notes page.
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# Re-read templates on every request so HTML edits show up without a restart.
spring.thymeleaf.cache=false

# Off now that the site has a login; turn it on temporarily if you need to poke at the database.
spring.h2.console.enabled=false
spring.h2.console.path=/h2-console

# ----- Notes -----
# Where recordings are stored (the Dockerfile points this at the /data volume).
notes.storage-dir=${NOTES_STORAGE_DIR:./data/recordings}
# AI summaries via Claude. Without a key the Summarize button uses a simple built-in summarizer.
notes.anthropic.api-key=${ANTHROPIC_API_KEY:}
notes.anthropic.model=${NOTES_SUMMARY_MODEL:claude-opus-5-5}
# Speech-to-text after a recording is uploaded (any OpenAI-style /audio/transcriptions API).
# Without a key, transcripts come from the browser's live transcript while recording.
# Groq: TRANSCRIPTION_BASE_URL=https://api.groq.com/openai/v1 and TRANSCRIPTION_MODEL=whisper-large-v3-turbo
notes.transcription.api-key=${TRANSCRIPTION_API_KEY:}
notes.transcription.base-url=${TRANSCRIPTION_BASE_URL:https://api.openai.com/v1}
notes.transcription.model=${TRANSCRIPTION_MODEL:whisper-1}
