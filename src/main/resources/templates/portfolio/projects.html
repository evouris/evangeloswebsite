<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Projects', ~{::main})}">
<head>
	<title>Projects</title>
</head>
<body>
<main class="space-y-10">
	<header class="space-y-2">
		<p class="eyebrow">$ ls ~/projects</p>
		<h1>Projects</h1>
	</header>

	<!-- Duplicate an article for each project (Stage 2 moves these into the database). -->
	<div class="grid gap-4 sm:grid-cols-2">
		<article class="card flex flex-col gap-3">
			<h2 class="text-lg">evangeloswebsite</h2>
			<p class="text-sm text-muted">This site: a portfolio plus a personal task manager and calendar.</p>
			<ul class="mt-auto flex flex-wrap gap-2">
				<li class="tag">Spring Boot</li>
				<li class="tag">Thymeleaf</li>
				<li class="tag">Tailwind</li>
			</ul>
		</article>
		<article class="card flex flex-col gap-3">
			<h2 class="text-lg">Project name</h2>
			<p class="text-sm text-muted">What it is and what you used.</p>
			<ul class="mt-auto flex flex-wrap gap-2">
				<li class="tag">Tech</li>
			</ul>
		</article>
	</div>
</main>
</body>
</html>
