<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Projects', ~{::main})}">
<head>
	<title>Projects</title>
</head>
<body>
<main class="space-y-10">
	<header class="flex flex-wrap items-end justify-between gap-4">
		<div class="space-y-2">
			<p class="eyebrow">$ ls ~/projects</p>
			<h1>Projects</h1>
		</div>
		<a th:href="@{/projects/manage}" class="btn-ghost">Manage</a>
	</header>

	<p th:if="${projects.empty}" class="py-8 text-center font-mono text-sm text-zinc-600">No projects yet.</p>

	<div th:unless="${projects.empty}" class="grid gap-4 sm:grid-cols-2">
		<th:block th:each="item : ${projects}">
			<article th:replace="~{portfolio/project-card :: card(${item})}"></article>
		</th:block>
	</div>
</main>
</body>
</html>
