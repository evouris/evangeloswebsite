<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: page('Tasks', ~{::main})}">
<head>
	<title>Tasks</title>
</head>
<body>
<main class="space-y-8">
	<header class="space-y-2">
		<p class="eyebrow">$ todo --list</p>
		<h1>Tasks</h1>
	</header>

	<form th:action="@{/tasks}" th:object="${task}" method="post" class="card grid gap-4 sm:grid-cols-[1fr_12rem]">
		<div>
			<label class="label" for="title">Title</label>
			<input class="input" type="text" th:field="*{title}" placeholder="What needs doing?" required>
			<span class="field-error" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span>
		</div>
		<div>
			<label class="label" for="dueDate">Due</label>
			<input class="input" type="date" th:field="*{dueDate}">
		</div>
		<div class="sm:col-span-2">
			<label class="label" for="notes">Notes</label>
			<textarea class="input min-h-20" th:field="*{notes}" placeholder="Optional details"></textarea>
		</div>
		<div class="sm:col-span-2">
			<button type="submit" class="btn">Add task</button>
		</div>
	</form>

	<p th:if="${tasks.empty}" class="py-8 text-center font-mono text-sm text-zinc-600">No tasks yet. Add one above.</p>

	<ul class="divide-y divide-border overflow-hidden rounded-lg border border-border" th:unless="${tasks.empty}">
		<li th:each="item : ${tasks}" class="flex items-start gap-4 bg-surface p-4">
			<form th:action="@{/tasks/{id}/complete(id=${item.id})}" method="post" class="pt-0.5">
				<button type="submit"
						class="flex size-5 cursor-pointer items-center justify-center rounded border transition"
						th:classappend="${item.completed} ? 'border-accent bg-accent text-bg' : 'border-zinc-600 hover:border-accent'"
						th:title="${item.completed} ? 'Mark not done' : 'Mark done'"
						th:aria-label="${item.completed} ? 'Mark not done' : 'Mark done'">
					<span th:if="${item.completed}" class="text-xs font-bold">&check;</span>
				</button>
			</form>

			<div class="min-w-0 flex-1 space-y-1">
				<p class="font-medium" th:classappend="${item.completed} ? 'text-zinc-500 line-through'" th:text="${item.title}">Title</p>
				<p th:if="${item.dueDate != null}" class="font-mono text-xs text-muted">
					due <time th:datetime="${item.dueDate}" th:text="${#temporals.format(item.dueDate, 'EEE, MMM d')}">date</time>
				</p>
				<p th:if="${item.notes != null and !#strings.isEmpty(item.notes)}"
				   class="whitespace-pre-line text-sm text-muted" th:text="${item.notes}">Notes</p>
			</div>

			<form th:action="@{/tasks/{id}/delete(id=${item.id})}" method="post">
				<button type="submit" class="btn-ghost btn-danger">Delete</button>
			</form>
		</li>
	</ul>
</main>
</body>
</html>
